name: presto_cli
help: Command line interface for Presto applications --- Derak Cloud All right received
version: 0.1.0

environment_variables:
- name: base_path
  help: Path of the application that docker compose files are located
  default: /opt/presto/

commands:
- name: ps
  alias: p
  help: Show process of docker

  args:
  - name: source
    required: true
    help: URL to download from
  - name: target
    help: "Target filename (default: same as source)"

  flags:
  - long: --force
    short: -f
    help: Overwrite existing files

  examples:
  - cli download example.com
  - cli download example.com ./output -f

  environment_variables:
  - name: default_target_location
    help: Set the default location to download to

- name: up
  help: Start presto cluster 
  args:
    - name: service
      help: Specific service name to up
      default: all
      allowed:
        - "all"
        - "presto"

- name: down
  help: Stop presto cluster 

- name: stop
  help: Stop service of presto cluster
  args:
    - name: service
      help: Specific service name to stop
      default: all
      allowed:
        - "all"
        - "presto"

- name: logs
  help: Show logs of presto cluster
  args:
    - name: service
      help: Specific service name to show logs
      default: all
      allowed:
        - "all"
        - "presto"


- name: restart
  help: Restart presto cluster
  args:
    - name: service
      help: Specific service name to restart
      default: all
      allowed:
        - "all"
        - "presto"


- name: exec
  help: Execute commands in the containers
  args:
    - name: service
      required: true
      help: Specific service to run command
      allowed:
        - "presto"
    - name: command
      required: true
      help: Command Passed down to the service

